<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mental Math & Pre-Calc — Trainer</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts: Inter + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- KaTeX for crisp math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>

  <style>
    :root {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Scale questions and revealed answers for center-stage legibility */
    .math-stage .katex,
    .math-stage.math-answer {
      font-size: clamp(2.1rem, 5.2vw, 4.25rem);
      line-height: 1.2;
    }
    /* Custom subtle scrollbars if viewport is very small */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #09090b;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 2px;
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 h-screen w-screen overflow-hidden flex flex-col justify-between select-none antialiased">

  <!-- 1. TOP BAR: Keyboard Controls -->
  <header class="w-full border-b border-zinc-900 px-4 sm:px-6 py-3 flex items-center justify-center bg-zinc-950/90 z-10">
    <p class="text-[11px] font-mono text-zinc-500 text-center">
      <kbd class="px-1.5 py-0.5 bg-zinc-900 border border-zinc-800 rounded text-zinc-300">Space</kbd> to reveal
      <span class="mx-2 text-zinc-700">·</span>
      <kbd class="px-1.5 py-0.5 bg-zinc-900 border border-zinc-800 rounded text-zinc-300">Space</kbd> again for the next question
    </p>
  </header>

  <!-- 2. CENTER STAGE: Pure Math Expression & Prompt -->
  <main class="flex-1 flex flex-col items-center justify-center px-4 relative overflow-hidden">
    <div
      id="stageCard"
      class="w-full max-w-4xl rounded-2xl border border-zinc-900 bg-zinc-950 px-6 py-10 sm:py-14 flex flex-col items-center justify-center text-center transition-colors duration-150"
    >
      <!-- Metadata Pill Row: Category Name + Expected Answer Type Badge -->
      <div class="flex items-center gap-2 mb-6">
        <span id="categoryBadge" class="px-2.5 py-0.5 rounded text-[11px] font-mono uppercase tracking-widest bg-zinc-900 text-zinc-400 border border-zinc-800">
          CATEGORY
        </span>
        <span id="answerTypeBadge" class="px-2.5 py-0.5 rounded text-[11px] font-mono uppercase tracking-widest bg-zinc-900 text-amber-400/90 border border-zinc-800">
          INTEGER
        </span>
      </div>

      <!-- KaTeX Rendered Expression -->
      <div id="mathContainer" class="math-stage min-h-[5.5rem] flex items-center justify-center px-2 font-mono font-medium text-zinc-50 overflow-x-auto max-w-full">
        <!-- Rendered by KaTeX -->
      </div>

      <!-- Crisp 1-4 Word Prompt Specifier -->
      <p id="promptText" class="mt-5 text-base sm:text-lg font-medium tracking-tight text-zinc-400">
        Evaluate
      </p>

    </div>
  </main>

  <!-- 3. BOTTOM TRAY: Category Toggle Pills -->
  <footer class="w-full border-t border-zinc-900 bg-zinc-950/95 px-4 sm:px-6 py-3.5 z-10">
    <div class="max-w-6xl mx-auto flex flex-col gap-2.5">
      <div class="flex items-center justify-between">
        <span class="text-[11px] font-mono uppercase tracking-wider text-zinc-500">
          Active Question Generators
        </span>
        <div class="flex items-center gap-2">
          <button
            id="allOnBtn"
            type="button"
            class="text-[11px] font-mono text-zinc-400 hover:text-zinc-100 px-2 py-0.5 rounded bg-zinc-900 border border-zinc-800 hover:border-zinc-700 transition-colors"
          >
            All On
          </button>
          <button
            id="allOffBtn"
            type="button"
            class="text-[11px] font-mono text-zinc-400 hover:text-zinc-100 px-2 py-0.5 rounded bg-zinc-900 border border-zinc-800 hover:border-zinc-700 transition-colors"
          >
            All Off
          </button>
          <button
            id="resetCoreBtn"
            type="button"
            class="text-[11px] font-mono text-zinc-400 hover:text-zinc-100 px-2 py-0.5 rounded bg-zinc-900 border border-zinc-800 hover:border-zinc-700 transition-colors"
          >
            Reset to Core
          </button>
        </div>
      </div>

      <!-- 4 Category Pills Grid -->
      <div id="categoryGrid" class="flex flex-wrap gap-1.5">
        <!-- Populated dynamically -->
      </div>
    </div>
  </footer>

  <script>
    /********************************************************************
     * 1. UTILITY HELPERS FOR DETERMINISTIC "NICE INTEGER" MATH
     ********************************************************************/
    const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    const choice = (arr) => arr[Math.floor(Math.random() * arr.length)];

    const isPrime = (n) => {
      if (n < 2) return false;
      if (n === 2 || n === 3) return true;
      if (n % 2 === 0 || n % 3 === 0) return false;
      for (let i = 5; i * i <= n; i += 6) {
        if (n % i === 0 || n % (i + 2) === 0) return false;
      }
      return true;
    };

    /********************************************************************
     * 2. FOUR CORE MATH QUESTION GENERATORS
     ********************************************************************/
    const CATEGORIES = [
      {
        id: 'MULT',
        label: 'Times Tables',
        defaultOn: true,
        generate() {
          const factors = [3, 4, 5, 6, 7, 8, 9, 11, 12];
          const a = choice(factors);
          // At most one factor may be below 5, avoiding the easiest low-by-low products.
          const b = a < 5 ? choice(factors.filter(n => n >= 5)) : choice(factors);
          const product = a * b;

          if (choice(['multiply', 'divide']) === 'divide') {
            return {
              latex: `${product} \\div ${a}`,
              answer: b,
              answerType: 'INTEGER'
            };
          }

          return {
            latex: `${a} \\times ${b}`,
            answer: product,
            answerType: 'INTEGER'
          };
        }
      },
      {
        id: 'POW_ROOT',
        label: 'Powers / Roots',
        defaultOn: true,
        generate() {
          const mode = choice(['sq', 'cube', 'pow2', 'sqrt', 'cbrt']);
          if (mode === 'sq') {
            const n = randInt(2, 30);
            return { latex: `${n}^2`, prompt: 'Evaluate', answer: n * n, answerType: 'INTEGER' };
          }
          if (mode === 'cube') {
            const n = randInt(2, 10);
            return { latex: `${n}^3`, prompt: 'Evaluate', answer: n * n * n, answerType: 'INTEGER' };
          }
          if (mode === 'pow2') {
            const n = randInt(1, 12);
            return { latex: `2^{${n}}`, prompt: 'Evaluate', answer: 1 << n, answerType: 'INTEGER' };
          }
          if (mode === 'sqrt') {
            const n = randInt(4, 30);
            return { latex: `\\sqrt{${n * n}}`, prompt: 'Principal root?', answer: n, answerType: 'INTEGER' };
          }
          const n = randInt(2, 10);
          return { latex: `\\sqrt[3]{${n * n * n}}`, prompt: 'Cube root?', answer: n, answerType: 'INTEGER' };
        }
      },
      {
        id: 'ALG_LOG',
        label: 'Logarithms',
        defaultOn: true,
        generate() {
          const specs = [
            { base: 2, kMin: -5, kMax: 8 },
            { base: 3, kMin: -3, kMax: 4 },
            { base: 4, kMin: -3, kMax: 4 },
            { base: 5, kMin: -3, kMax: 3 },
            { base: 10, kMin: -3, kMax: 5 }
          ];
          const { base, kMin, kMax } = choice(specs);
          const k = randInt(kMin, kMax);
          let argLatex;
          if (k >= 0) {
            argLatex = `${Math.pow(base, k)}`;
          } else {
            argLatex = `\\frac{1}{${Math.pow(base, Math.abs(k))}}`;
          }
          return {
            latex: `\\log_{${base}}\\left(${argLatex}\\right)`,
            prompt: 'Evaluate',
            answer: k,
            answerType: 'INTEGER'
          };
        }
      },
      {
        id: 'PRIME',
        label: 'Is Prime',
        defaultOn: true,
        generate() {
          const shouldBePrime = Math.random() < 0.5;
          // Odd integers from 11 through 143, balanced between primes and composites.
          let n = randInt(5, 71) * 2 + 1;
          while (isPrime(n) !== shouldBePrime) {
            n = randInt(5, 71) * 2 + 1;
          }
          return {
            latex: `${n}`,
            prompt: 'Is this number prime?',
            answer: shouldBePrime,
            answerType: 'TRUE / FALSE'
          };
        }
      }
    ];

    /********************************************************************
     * 3. APPLICATION STATE & UI CONTROLLER
     ********************************************************************/
    const state = {
      activeCategories: new Set(CATEGORIES.filter(c => c.defaultOn).map(c => c.id)),
      currentQuestion: null,
      isRevealed: false
    };

    // DOM Elements
    const stageCard = document.getElementById('stageCard');
    const categoryBadge = document.getElementById('categoryBadge');
    const answerTypeBadge = document.getElementById('answerTypeBadge');
    const mathContainer = document.getElementById('mathContainer');
    const promptText = document.getElementById('promptText');
    const categoryGrid = document.getElementById('categoryGrid');
    const allOnBtn = document.getElementById('allOnBtn');
    const allOffBtn = document.getElementById('allOffBtn');
    const resetCoreBtn = document.getElementById('resetCoreBtn');

    function renderCategoryPills() {
      categoryGrid.innerHTML = '';
      CATEGORIES.forEach(cat => {
        const isActive = state.activeCategories.has(cat.id);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = isActive
          ? 'px-2.5 py-1 rounded-md text-xs font-mono border transition-all bg-zinc-100 text-zinc-950 border-zinc-100 font-medium'
          : 'px-2.5 py-1 rounded-md text-xs font-mono border transition-all bg-zinc-900/60 text-zinc-500 border-zinc-800/80 hover:border-zinc-700 hover:text-zinc-300';
        btn.textContent = cat.label;
        btn.addEventListener('click', () => {
          const wasEmpty = state.activeCategories.size === 0;
          if (state.activeCategories.has(cat.id)) {
            state.activeCategories.delete(cat.id);
          } else {
            state.activeCategories.add(cat.id);
          }
          renderCategoryPills();

          if (state.activeCategories.size === 0) {
            nextQuestion();
          } else if (wasEmpty || (state.currentQuestion && !state.activeCategories.has(state.currentQuestion.categoryId))) {
            nextQuestion();
          }
        });
        categoryGrid.appendChild(btn);
      });
    }

    function nextQuestion() {
      state.isRevealed = false;
      stageCard.classList.remove('border-amber-500/70', 'bg-amber-950/15');
      stageCard.classList.add('border-zinc-900', 'bg-zinc-950');
      mathContainer.classList.remove('text-amber-300', 'math-answer');
      mathContainer.classList.add('text-zinc-50');

      const enabled = CATEGORIES.filter(c => state.activeCategories.has(c.id));
      if (enabled.length === 0) {
        state.currentQuestion = null;
        categoryBadge.textContent = 'STANDBY';
        answerTypeBadge.textContent = 'NONE';
        mathContainer.innerHTML = '<span class="text-xl sm:text-2xl font-mono text-zinc-500">No categories selected</span>';
        promptText.textContent = 'Select at least one category below to begin drilling.';
        promptText.classList.remove('hidden', 'invisible');
        return;
      }

      const chosenCat = choice(enabled);
      const q = chosenCat.generate();
      q.categoryId = chosenCat.id;
      q.categoryLabel = chosenCat.label;
      state.currentQuestion = q;

      // Update Metadata Badges
      categoryBadge.textContent = q.categoryLabel;
      answerTypeBadge.textContent = q.answerType;

      // Render KaTeX
      try {
        katex.render(q.latex, mathContainer, {
          displayMode: true,
          throwOnError: false
        });
      } catch (err) {
        mathContainer.textContent = q.latex;
      }

      promptText.textContent = q.prompt || '';
      promptText.classList.remove('invisible');
      promptText.classList.toggle('hidden', !q.prompt);
    }

    function revealAnswer() {
      if (state.isRevealed || !state.currentQuestion) return;
      state.isRevealed = true;

      const ansDisplay = typeof state.currentQuestion.answer === 'boolean'
        ? (state.currentQuestion.answer ? 'True' : 'False')
        : String(state.currentQuestion.answer);

      stageCard.classList.remove('border-zinc-900', 'bg-zinc-950');
      stageCard.classList.add('border-amber-500/70', 'bg-amber-950/15');

      mathContainer.textContent = ansDisplay;
      mathContainer.classList.remove('text-zinc-50');
      mathContainer.classList.add('text-amber-300', 'math-answer');
      // Hide auxiliary prompts without moving the question/answer position.
      promptText.classList.add('invisible');
    }

    /********************************************************************
     * 4. KEYBOARD & BUTTON EVENT WIRING
     ********************************************************************/
    allOnBtn.addEventListener('click', () => {
      const wasEmpty = state.activeCategories.size === 0;
      CATEGORIES.forEach(c => state.activeCategories.add(c.id));
      renderCategoryPills();
      if (wasEmpty || !state.currentQuestion) {
        nextQuestion();
      }
    });

    allOffBtn.addEventListener('click', () => {
      state.activeCategories.clear();
      renderCategoryPills();
      nextQuestion();
    });

    resetCoreBtn.addEventListener('click', () => {
      state.activeCategories.clear();
      CATEGORIES.filter(c => c.defaultOn).forEach(c => state.activeCategories.add(c.id));
      renderCategoryPills();
      nextQuestion();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key !== ' ' && e.code !== 'Space') return;
      e.preventDefault();
      if (e.repeat) return;

      if (state.isRevealed) {
        nextQuestion();
      } else {
        revealAnswer();
      }
    });

    // Initialize App on Load
    window.addEventListener('DOMContentLoaded', () => {
      renderCategoryPills();
      nextQuestion();
    });
  </script>
</body>
</html>
