---
layout: default
---
<h1>Articles</h1>
<ul class="article-list">
  {% for post in site.posts %}
  <li>
    <a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a>
    <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%-d %B %Y' }}</time>
  </li>
  {% endfor %}
</ul>
