title: Chris Dance
description: Articles and notes by Chris Dance.
url: "https://almostnontrivial.github.io"
baseurl: ""
markdown: kramdown
permalink: /articles/:title/
timezone: Europe/London
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
